# Wait 7 days before resolving newly published package versions, so the ecosystem has time to
# detect and yank compromised releases before CI installs them.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
# Keep release-age exceptions exact so later releases do not bypass the cooling period.
minimumReleaseAgeExclude:
  # Reviewed first-party release, published 2026-10-28 from samebase/identity-broker main.
  # Remove after 2026-11-04, when the 7-day cooling period is complete.
  - "@samebase/identity-broker@0.1.0"
# Decided here, because pnpm in CI refuses an install with undecided build scripts.
allowBuilds:
  esbuild: true
  core-js-pure: false
  workerd: false
peerDependencyRules:
  allowedVersions:
    "@samebase/alchemy-convex": "0.3.0"
