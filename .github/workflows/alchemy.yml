# Deploys with Alchemy (alchemy.run.ts): a push to main deploys the stage `prod`, the production
# deployment, and nothing else; the hub has no previews. The state is in the `alchemy-state`
# project of the team, under the stack name GITHUB_REPOSITORY. The run needs the team token
# CONVEX_ACCESS_TOKEN, with which it mints the deploy key itself, plus the Google and GitHub
# clients, which the stack hands to the deployment. Only the Alchemy step gets the secrets.
name: alchemy
on:
  push: { branches: [main] }
  # Run once on main with adopt to take over a project with the name of the repository that
  # exists already.
  workflow_dispatch: { inputs: { adopt: { type: boolean, default: false } } }
permissions: { contents: read }
# One deploy at a time: the state store has no lock. A newer push waits, so the last deploy is the
# newest commit.
concurrency: { group: alchemy-prod, queue: max, cancel-in-progress: false }
jobs:
  alchemy:
    # A dispatch from another branch deploys nothing: only main is production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # A re-run of an old run must not put older code over newer code.
      - name: Check that the checkout is the head of main
        env: { TOKEN: "${{ github.token }}" }
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          head=$(git -c "http.extraheader=AUTHORIZATION: basic $auth" ls-remote origin refs/heads/main | cut -f1)
          if [ "$(git rev-parse HEAD)" != "$head" ]; then
            echo "::error::The checkout is not the head of main ($head). Nothing was deployed."
            exit 1
          fi
      # A repository without the token, such as a copy of this one, deploys nothing and says so.
      - name: Skip without the Convex token
        id: keys
        env:
          TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::No deploy: set CONVEX_ACCESS_TOKEN as a repository secret (README, Deploy)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy production
        if: steps.keys.outputs.skip != 'true'
        run: |
          if [ "$ADOPT" = "true" ]; then set -- --adopt; fi
          pnpm exec alchemy deploy --stage prod --yes --no-input "$@"
        env:
          ADOPT: ${{ inputs.adopt }}
          CONVEX_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
